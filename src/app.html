<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="Bingoals turns your yearly goals into a bingo board. Set 25 goals, mark them off as you finish, share your progress, and aim for bingo. Free and no sign-up required."
    />
    <meta property="og:site_name" content="Bingoals" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://gobingoals.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bingoals — turn your goals into a bingo board" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://gobingoals.app/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
